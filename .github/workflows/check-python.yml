name: Reusable Check Python

on:
  workflow_call:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed client_code/*.py files
        run: |
          git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD" \
            -- client_code \
            | grep '\.py$' > changed_py_files.txt || true
          while read -r f; do [ -f "$f" ] && echo "$f"; done < changed_py_files.txt > tmp.txt
          mv tmp.txt changed_py_files.txt
          echo "Changed .py files in this PR:"
          cat changed_py_files.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the changed .py files only
        run: |
          if [ ! -s changed_py_files.txt ]; then
            echo "No .py changes under client_code/ — nothing to check."
            exit 0
          fi

          echo "=== Syntax check ==="
          while read -r f; do
            [ -f "$f" ] || { echo "Skipping $f (no longer exists)"; continue; }
            echo "Checking $f ..."
            python -m py_compile "$f"
          done < changed_py_files.txt

          echo ""
          echo "=== Runtime check ==="
          while read -r f; do
            [ -f "$f" ] || { echo "Skipping $f (no longer exists)"; continue; }
            echo "Running $f ..."
            python "$f"
          done < changed_py_files.txt
