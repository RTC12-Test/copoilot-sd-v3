# CI Build — place this file in the TARGET repo (the repo that holds
# client_code/ and infra/terraform/). It CALLS the reusable check
# workflows defined in the central CI engine repo.
#
# Reference the engine repo + the ref/branch to use, e.g.:
#   uses: RTC12-Test/copoilot-sd-v3/.github/workflows/check-python.yml@main
#
# Only runs on PRs touching client_code/ or infra/terraform/.

name: CI Build

on:
  pull_request:
    branches: [main]
    paths:
      - "client_code/**"
      - "infra/terraform/**"

jobs:
  yaml:
    if: >-
      !startsWith(github.head_ref, 'self-heal/') &&
      !startsWith(github.ref_name, 'self-heal/')
    uses: RTC12-Test/copoilot-sd-v3/.github/workflows/check-yaml.yml@main

  terraform:
    needs: yaml
    if: >-
      always() &&
      !startsWith(github.head_ref, 'self-heal/') &&
      !startsWith(github.ref_name, 'self-heal/')
    uses: RTC12-Test/copoilot-sd-v3/.github/workflows/check-terraform.yml@main

  python:
    needs: terraform
    if: >-
      always() &&
      !startsWith(github.head_ref, 'self-heal/') &&
      !startsWith(github.ref_name, 'self-heal/')
    uses: RTC12-Test/copoilot-sd-v3/.github/workflows/check-python.yml@main
