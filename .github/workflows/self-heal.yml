# Self-Heal Build Failure — place this file in the TARGET repo (the repo
# holding client_code/ and infra/terraform/).
#
# Triggers whenever the "CI Build" workflow FAILS. It:
#   1. Checks out the failing branch of this (target) repo.
#   2. Clones the healer source from the central agent repo (RTC12-Test/copoilot-sd-v3).
#   3. Runs src/healer.py which fixes broken .py (client_code/) and
#      .tf/.yaml (infra/terraform/) files and opens a PR.

name: Self-Heal Build Failure

on:
  workflow_run:
    workflows: ["CI Build"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  heal:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo (failing branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0   # full history so the healer can diff against the base

      - name: Fetch healer source from central agent repo
        run: |
          AGENT_REPO="${{ secrets.AGENT_REPO || 'RTC12-Test/copoilot-sd-v3' }}"
          git clone --depth 1 "https://github.com/${AGENT_REPO}.git" /tmp/self-healer
          mkdir -p ./src
          cp -r /tmp/self-healer/src/healing ./src/healing
          cp /tmp/self-healer/src/healer.py ./src/healer.py
          cp /tmp/self-healer/requirements.txt ./requirements.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.2"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m copilot download-runtime

      - name: Configure gh auth
        run: echo "${{ secrets.COPILOT_OAUTH_TOKEN }}" | gh auth login --with-token

      - name: Run self-healer (changed client_code/infra files)
        env:
          GITHUB_TOKEN: ${{ secrets.HEALER_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.COPILOT_OAUTH_TOKEN }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CHANGE_BASE: origin/${{ github.event.workflow_run.repository.default_branch || github.event.repository.default_branch || 'main' }}
        run: python src/healer.py
