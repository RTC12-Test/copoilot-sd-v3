name: ci-fixer-webhook
description: |
  Receives GitHub webhooks (workflow_run, check_run) from all child repos in the
  org, filters for CI failures, and triggers the ci-fixer repository_dispatch in
  the central repo so a fix workflow runs immediately (no polling).
url: https://github.com/${central-owner}/copilot-central
hook_attributes:
  url: ${WEBHOOK_URL}
redirect_url: https://github.com/${central-owner}/copilot-central
public: false
has_issues: true
default_permissions:
  actions: read
  checks: read
  metadata: read
  contents: read
  pull_requests: write
  issues: write
# org installed; select "All repositories" so every child auto-follows.
default_events:
  - workflow_run
  - check_run
  - workflow_job
