# Application config — read by terraform via yamldecode()
# Reference: my-sso-infra/config_env/dev/config.yaml

region: "us-east-1"
environment: "dev"
org_name: "myorg"
app_name: "my-app"

# S3
s3_bucket_prefix: "data"
s3_bucket_key_prefix: "objects/"
s3_enable_versioning: true
s3_sse_algorithm: "AES256"

# CloudWatch
cloudwatch_log_retention_days: 14
cloudwatch_alarm_sns_topic_arn: "arn:aws:sns:us-east-1:123456789012:my-app-alerts"
cloudwatch_alarm_threshold: 10
cloudwatch_alarm_period: 300
cloudwatch_metric_namespace: "App/Logs"
cloudwatch_error_pattern: "ERROR"

# ECS Cluster
ecs_cluster_name: "myorg-my-app-dev-ecs-cluster"
ecs_enable_container_insights: "enabled"
ecs_container_insights_setting: "containerInsights"
map_migrated_tag: "mig42366"

# Tags
tags:
  ManagedBy: "terraform"
  Environment: "dev"
  Project: "my-app"

default_tags:
  ManagedBy: "terraform"
  Environment: "dev"
  Project: "my-app"
  org: "myorg"
  application: "my-app"
  division: "st"
  department: "a86065"
  technicalContact: "support@example.com"
